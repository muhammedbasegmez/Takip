<!DOCTYPE html>
<html lang="tr" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Money Manager - Bütçe ve Finans Yönetimi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* iOS Safe Area & Custom Scrollbar */
        body {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="h-full text-slate-800 antialiased flex flex-col justify-between max-w-md mx-auto bg-white min-h-screen shadow-2xl relative">

    <!-- PIN SECURITY OVERLAY -->
    <div id="pinOverlay" class="fixed inset-0 bg-slate-900 z-[100] flex flex-col items-center justify-center p-6 text-white hidden">
        <div class="w-16 h-16 bg-red-500/20 rounded-full flex items-center justify-center mb-4 text-red-500">
            <i data-lucide="lock" class="w-8 h-8"></i>
        </div>
        <h2 class="text-xl font-bold mb-2">Güvenlik Kilidi</h2>
        <p class="text-slate-400 text-sm mb-6">Devam etmek için 4 haneli PIN kodunuzu girin</p>
        
        <!-- PIN Dots -->
        <div class="flex gap-4 mb-8">
            <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-600"></div>
            <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-600"></div>
            <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-600"></div>
            <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-600"></div>
        </div>

        <!-- PIN Numpad -->
        <div class="grid grid-cols-3 gap-4 w-64">
            <button onclick="pressPin('1')" class="h-14 rounded-full bg-slate-800 text-xl font-bold active:bg-slate-700">1</button>
            <button onclick="pressPin('2')" class="h-14 rounded-full bg-slate-800 text-xl font-bold active:bg-slate-700">2</button>
            <button onclick="pressPin('3')" class="h-14 rounded-full bg-slate-800 text-xl font-bold active:bg-slate-700">3</button>
            <button onclick="pressPin('4')" class="h-14 rounded-full bg-slate-800 text-xl font-bold active:bg-slate-700">4</button>
            <button onclick="pressPin('5')" class="h-14 rounded-full bg-slate-800 text-xl font-bold active:bg-slate-700">5</button>
            <button onclick="pressPin('6')" class="h-14 rounded-full bg-slate-800 text-xl font-bold active:bg-slate-700">6</button>
            <button onclick="pressPin('7')" class="h-14 rounded-full bg-slate-800 text-xl font-bold active:bg-slate-700">7</button>
            <button onclick="pressPin('8')" class="h-14 rounded-full bg-slate-800 text-xl font-bold active:bg-slate-700">8</button>
            <button onclick="pressPin('9')" class="h-14 rounded-full bg-slate-800 text-xl font-bold active:bg-slate-700">9</button>
            <div></div>
            <button onclick="pressPin('0')" class="h-14 rounded-full bg-slate-800 text-xl font-bold active:bg-slate-700">0</button>
            <button onclick="clearPin()" class="h-14 rounded-full bg-slate-800/50 text-slate-400 flex items-center justify-center active:bg-slate-700">
                <i data-lucide="delete" class="w-6 h-6"></i>
            </button>
        </div>
    </div>

    <!-- MAIN APP CONTENT -->
    <div id="app" class="flex-1 flex flex-col pb-20">

        <!-- HEADER -->
        <header class="bg-red-500 text-white p-4 sticky top-0 z-30 shadow-md">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-2">
                    <i data-lucide="wallet" class="w-6 h-6"></i>
                    <h1 class="font-bold text-lg">Money Manager</h1>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="exportCSV()" title="CSV İndir" class="p-1.5 hover:bg-red-600 rounded-lg transition">
                        <i data-lucide="download" class="w-5 h-5"></i>
                    </button>
                    <button onclick="openSettingsModal()" title="Ayarlar" class="p-1.5 hover:bg-red-600 rounded-lg transition">
                        <i data-lucide="settings" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <!-- SEARCH & FILTER BAR -->
            <div class="flex gap-2">
                <div class="relative flex-1">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2.5 text-red-200"></i>
                    <input type="text" id="searchInput" oninput="renderApp()" placeholder="İşlem veya kategori ara..." 
                           class="w-full bg-red-600/50 text-white placeholder-red-200 text-sm pl-9 pr-3 py-1.5 rounded-lg border border-red-400/30 focus:outline-none focus:bg-red-600">
                </div>
                <select id="dateFilter" onchange="renderApp()" class="bg-red-600/50 text-white text-xs px-2 py-1.5 rounded-lg border border-red-400/30 focus:outline-none">
                    <option value="all" class="text-slate-800">Tüm Zamanlar</option>
                    <option value="today" class="text-slate-800">Bugün</option>
                    <option value="week" class="text-slate-800">Bu Hafta</option>
                    <option value="month" selected class="text-slate-800">Bu Ay</option>
                </select>
            </div>
        </header>

        <!-- DASHBOARD CARDS (Summary) -->
        <div class="p-4 grid grid-cols-3 gap-3 bg-slate-100 border-b border-slate-200">
            <div class="bg-white p-3 rounded-xl border border-slate-200/80 shadow-sm text-center">
                <span class="text-[10px] uppercase font-bold text-slate-400 block mb-1">Gelir</span>
                <span id="summaryIncome" class="text-xs font-bold text-emerald-600">₺0,00</span>
            </div>
            <div class="bg-white p-3 rounded-xl border border-slate-200/80 shadow-sm text-center">
                <span class="text-[10px] uppercase font-bold text-slate-400 block mb-1">Gider</span>
                <span id="summaryExpense" class="text-xs font-bold text-red-500">₺0,00</span>
            </div>
            <div class="bg-white p-3 rounded-xl border border-slate-200/80 shadow-sm text-center">
                <span class="text-[10px] uppercase font-bold text-slate-400 block mb-1">Net Bakiye</span>
                <span id="summaryNet" class="text-xs font-bold text-slate-800">₺0,00</span>
            </div>
        </div>

        <!-- MAIN TABS CONTENT AREA -->
        <main class="flex-1 p-4">
            
            <!-- TAB 1: TRANSACTIONS LIST -->
            <section id="tabTransactions" class="tab-content">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">İşlem Geçmişi</h2>
                    <span id="txCountBadge" class="text-xs font-semibold bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full">0 İşlem</span>
                </div>
                <div id="transactionsList" class="space-y-2">
                    <!-- Dynamic Transaction Rows -->
                </div>
            </section>

            <!-- TAB 2: ANALYTICS & CHARTS -->
            <section id="tabAnalytics" class="tab-content hidden">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Kategori Harcama Analizi</h2>
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-4">
                    <div class="w-48 h-48 mx-auto relative">
                        <canvas id="expenseChart"></canvas>
                    </div>
                </div>
                <div id="categoryBreakdown" class="space-y-2">
                    <!-- Dynamic Category Breakdown -->
                </div>
            </section>

            <!-- TAB 3: RECURRING TEMPLATES -->
            <section id="tabRecurring" class="tab-content hidden">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Sabit Ödemeler (Aylık)</h2>
                    <button onclick="openTransactionModal('gider', true)" class="text-xs text-red-500 font-bold hover:underline">+ Yeni Ekle</button>
                </div>
                <div id="recurringList" class="space-y-2">
                    <!-- Dynamic Recurring List -->
                </div>
            </section>

        </main>
    </div>

    <!-- FLOATING ACTION BUTTON (FAB) -->
    <button onclick="openTransactionModal()" class="fixed bottom-20 right-6 w-14 h-14 bg-red-500 text-white rounded-full shadow-lg flex items-center justify-center hover:bg-red-600 active:scale-95 transition z-40">
        <i data-lucide="plus" class="w-8 h-8"></i>
    </button>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-slate-200 flex justify-around py-2 z-40">
        <button onclick="switchTab('transactions')" id="navTransactions" class="nav-btn flex flex-col items-center gap-1 text-red-500">
            <i data-lucide="list" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium">İşlemler</span>
        </button>
        <button onclick="switchTab('analytics')" id="navAnalytics" class="nav-btn flex flex-col items-center gap-1 text-slate-400">
            <i data-lucide="pie-chart" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium">Analiz</span>
        </button>
        <button onclick="switchTab('recurring')" id="navRecurring" class="nav-btn flex flex-col items-center gap-1 text-slate-400">
            <i data-lucide="repeat" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium">Sabitler</span>
        </button>
    </nav>

    <!-- TRANSACTION MODAL (NEW / EDIT) -->
    <div id="txModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto animate-in slide-in-from-bottom duration-200">
            
            <div class="flex justify-between items-center border-b pb-3">
                <h3 id="modalTitle" class="font-bold text-slate-800">Yeni İşlem Ekle</h3>
                <button onclick="closeModal('txModal')" class="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <!-- TYPE TOGGLE (Income / Expense) -->
            <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-xl">
                <button type="button" id="btnTypeExpense" onclick="setTxType('gider')" class="py-2 text-xs font-bold rounded-lg bg-red-500 text-white shadow-sm transition">
                    Gider
                </button>
                <button type="button" id="btnTypeIncome" onclick="setTxType('gelir')" class="py-2 text-xs font-bold rounded-lg text-slate-600 transition">
                    Gelir
                </button>
            </div>

            <!-- AMOUNT INPUT (NUMPAD FRIENDLY) -->
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Tutar (₺)</label>
                <input type="text" id="txAmount" inputmode="decimal" pattern="[0-9]*" placeholder="0.00" 
                       class="w-full text-3xl font-extrabold text-slate-800 p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-500 text-right">
            </div>

            <!-- COLORFUL CATEGORY GRID SELECTION -->
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-2">Kategori Seçin</label>
                <div id="categoryGrid" class="grid grid-cols-4 gap-2">
                    <!-- Dynamic Category Buttons -->
                </div>
            </div>

            <!-- DESCRIPTION & DATE -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Açıklama</label>
                    <input type="text" id="txDesc" placeholder="Örn: Market alışverişi" class="w-full text-xs p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-red-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Tarih</label>
                    <input type="date" id="txDate" class="w-full text-xs p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-red-500">
                </div>
            </div>

            <!-- RECURRING CHECKBOX -->
            <div class="flex items-center gap-2 pt-1">
                <input type="checkbox" id="txIsRecurring" class="w-4 h-4 text-red-500 rounded border-slate-300 focus:ring-red-500">
                <label for="txIsRecurring" class="text-xs text-slate-600 font-medium">Her ay otomatik tekrarla (Sabit Ödeme)</label>
            </div>

            <!-- SUBMIT BUTTON -->
            <button onclick="saveTransaction()" class="w-full py-3 bg-red-500 text-white font-bold rounded-xl shadow-lg hover:bg-red-600 active:scale-98 transition">
                İşlemi Kaydet
            </button>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settingsModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-md rounded-2xl p-5 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-slate-800">Uygulama Ayarları</h3>
                <button onclick="closeModal('settingsModal')" class="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <!-- PIN LOCK TOGGLE -->
            <div class="space-y-3">
                <div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl">
                    <div>
                        <span class="text-sm font-bold block text-slate-800">PIN Güvenliği</span>
                        <span class="text-xs text-slate-400">Açılışta 4 haneli şifre sor</span>
                    </div>
                    <button onclick="togglePinSecurity()" id="btnPinToggle" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-slate-200 text-slate-600">
                        Devre Dışı
                    </button>
                </div>

                <!-- BACKUP / RESTORE JSON -->
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="exportJSON()" class="py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl flex items-center justify-center gap-1.5">
                        <i data-lucide="file-json" class="w-4 h-4"></i>
                        Yedek İndir (JSON)
                    </button>
                    <label class="py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl flex items-center justify-center gap-1.5 cursor-pointer">
                        <i data-lucide="upload" class="w-4 h-4"></i>
                        Yedek Yükle
                        <input type="file" id="importJsonFile" onchange="importJSON(event)" accept=".json" class="hidden">
                    </label>
                </div>

                <!-- RESET ALL DATA -->
                <button onclick="resetAllData()" class="w-full py-2.5 border border-red-200 text-red-500 hover:bg-red-50 text-xs font-bold rounded-xl transition">
                    Tüm Verileri Sıfırla
                </button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // DEFAULT CATEGORIES WITH COLORS & LUCIDE ICONS
        const DEFAULT_CATEGORIES = [
            { id: 'cat_market', name: 'Market', icon: 'shopping-cart', color: 'bg-emerald-500', type: 'gider' },
            { id: 'cat_fatura', name: 'Fatura', icon: 'zap', color: 'bg-amber-500', type: 'gider' },
            { id: 'cat_ulasim', name: 'Ulaşım', icon: 'bus', color: 'bg-blue-500', type: 'gider' },
            { id: 'cat_yemek', name: 'Yemek', icon: 'utensils', color: 'bg-orange-500', type: 'gider' },
            { id: 'cat_eglence', name: 'Eğlence', icon: 'film', color: 'bg-purple-500', type: 'gider' },
            { id: 'cat_saglik', name: 'Sağlık', icon: 'activity', color: 'bg-rose-500', type: 'gider' },
            { id: 'cat_maas', name: 'Maaş', icon: 'briefcase', color: 'bg-teal-500', type: 'gelir' },
            { id: 'cat_ekgelir', name: 'Ek Gelir', icon: 'trending-up', color: 'bg-indigo-500', type: 'gelir' }
        ];

        // INITIAL STATE MANAGEMENT
        let state = {
            transactions: JSON.parse(localStorage.getItem('mm_txs')) || [],
            categories: JSON.parse(localStorage.getItem('mm_cats')) || DEFAULT_CATEGORIES,
            pinEnabled: JSON.parse(localStorage.getItem('mm_pin_enabled')) || false,
            pinCode: localStorage.getItem('mm_pin_code') || '1234'
        };

        let currentType = 'gider';
        let selectedCategory = null;
        let editingTxId = null;
        let enteredPin = '';
        let chartInstance = null;

        // INITIALIZATION
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            document.getElementById('txDate').valueAsDate = new Date();
            checkPinSecurity();
            renderApp();
        });

        // SECURITY PIN CONTROL
        function checkPinSecurity() {
            const overlay = document.getElementById('pinOverlay');
            if (state.pinEnabled) {
                overlay.classList.remove('hidden');
            } else {
                overlay.classList.add('hidden');
            }
        }

        function pressPin(num) {
            if (enteredPin.length < 4) {
                enteredPin += num;
                updatePinDots();
                if (enteredPin.length === 4) {
                    setTimeout(() => {
                        if (enteredPin === state.pinCode) {
                            document.getElementById('pinOverlay').classList.add('hidden');
                            enteredPin = '';
                            updatePinDots();
                        } else {
                            alert('Hatalı PIN!');
                            clearPin();
                        }
                    }, 100);
                }
            }
        }

        function clearPin() {
            enteredPin = '';
            updatePinDots();
        }

        function updatePinDots() {
            const dots = document.querySelectorAll('.pin-dot');
            dots.forEach((dot, index) => {
                if (index < enteredPin.length) {
                    dot.classList.add('bg-red-500', 'border-red-500');
                } else {
                    dot.classList.remove('bg-red-500', 'border-red-500');
                }
            });
        }

        function togglePinSecurity() {
            state.pinEnabled = !state.pinEnabled;
            if (state.pinEnabled && !state.pinCode) {
                state.pinCode = '1234';
            }
            localStorage.setItem('mm_pin_enabled', JSON.stringify(state.pinEnabled));
            localStorage.setItem('mm_pin_code', state.pinCode);
            updateSettingsUI();
        }

        function updateSettingsUI() {
            const btn = document.getElementById('btnPinToggle');
            if (state.pinEnabled) {
                btn.innerText = 'Aktif (PIN: ' + state.pinCode + ')';
                btn.className = 'px-3 py-1.5 text-xs font-bold rounded-lg bg-emerald-500 text-white';
            } else {
                btn.innerText = 'Devre Dışı';
                btn.className = 'px-3 py-1.5 text-xs font-bold rounded-lg bg-slate-200 text-slate-600';
            }
        }

        // NAVIGATION TABS
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.replace('text-red-500', 'text-slate-400'));

            if (tabName === 'transactions') {
                document.getElementById('tabTransactions').classList.remove('hidden');
                document.getElementById('navTransactions').classList.replace('text-slate-400', 'text-red-500');
            } else if (tabName === 'analytics') {
                document.getElementById('tabAnalytics').classList.remove('hidden');
                document.getElementById('navAnalytics').classList.replace('text-slate-400', 'text-red-500');
                renderAnalyticsChart();
            } else if (tabName === 'recurring') {
                document.getElementById('tabRecurring').classList.remove('hidden');
                document.getElementById('navRecurring').classList.replace('text-slate-400', 'text-red-500');
                renderRecurringList();
            }
        }

        // TRANSACTION MODAL & CATEGORY RENDER
        function openTransactionModal(type = 'gider', isRecurring = false) {
            editingTxId = null;
            document.getElementById('modalTitle').innerText = 'Yeni İşlem Ekle';
            document.getElementById('txAmount').value = '';
            document.getElementById('txDesc').value = '';
            document.getElementById('txDate').valueAsDate = new Date();
            document.getElementById('txIsRecurring').checked = isRecurring;
            
            setTxType(type);
            document.getElementById('txModal').classList.remove('hidden');
        }

        function setTxType(type) {
            currentType = type;
            const btnExp = document.getElementById('btnTypeExpense');
            const btnInc = document.getElementById('btnTypeIncome');

            if (type === 'gider') {
                btnExp.className = 'py-2 text-xs font-bold rounded-lg bg-red-500 text-white shadow-sm transition';
                btnInc.className = 'py-2 text-xs font-bold rounded-lg text-slate-600 transition';
            } else {
                btnInc.className = 'py-2 text-xs font-bold rounded-lg bg-emerald-500 text-white shadow-sm transition';
                btnExp.className = 'py-2 text-xs font-bold rounded-lg text-slate-600 transition';
            }

            renderCategoryGrid();
        }

        function renderCategoryGrid() {
            const grid = document.getElementById('categoryGrid');
            grid.innerHTML = '';

            const filteredCats = state.categories.filter(c => c.type === currentType);
            if (filteredCats.length > 0) {
                selectedCategory = filteredCats[0].name;
            }

            filteredCats.forEach(cat => {
                const isSelected = selectedCategory === cat.name;
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.onclick = () => selectCategory(cat.name);
                btn.className = `flex flex-col items-center justify-center p-2.5 rounded-xl border text-center transition ${
                    isSelected ? 'border-red-500 bg-red-50 text-red-600 ring-2 ring-red-500/20' : 'border-slate-200 bg-white text-slate-600'
                }`;

                btn.innerHTML = `
                    <div class="w-8 h-8 ${cat.color} text-white rounded-full flex items-center justify-center mb-1 shadow-sm">
                        <i data-lucide="${cat.icon}" class="w-4 h-4"></i>
                    </div>
                    <span class="text-[10px] font-bold truncate w-full">${cat.name}</span>
                `;
                grid.appendChild(btn);
            });
            lucide.createIcons();
        }

        function selectCategory(catName) {
            selectedCategory = catName;
            renderCategoryGrid();
        }

        // SAVE TRANSACTION
        function saveTransaction() {
            const amountInput = document.getElementById('txAmount').value.replace(',', '.');
            const amount = parseFloat(amountInput);
            const desc = document.getElementById('txDesc').value.trim();
            const date = document.getElementById('txDate').value;
            const isRecurring = document.getElementById('txIsRecurring').checked;

            if (isNaN(amount) || amount <= 0) {
                alert('Lütfen geçerli bir tutar girin!');
                return;
            }

            if (editingTxId) {
                state.transactions = state.transactions.map(t => t.id === editingTxId ? {
                    ...t, type: currentType, amount, category: selectedCategory, desc, date, isRecurring
                } : t);
            } else {
                const newTx = {
                    id: 'tx_' + Date.now(),
                    type: currentType,
                    amount,
                    category: selectedCategory,
                    desc: desc || selectedCategory,
                    date,
                    isRecurring
                };
                state.transactions.unshift(newTx);
            }

            saveToLocalStorage();
            closeModal('txModal');
            renderApp();
        }

        function deleteTransaction(id) {
            if (confirm('Bu işlemi silmek istediğinize emin misiniz?')) {
                state.transactions = state.transactions.filter(t => t.id !== id);
                saveToLocalStorage();
                renderApp();
            }
        }

        // RENDER APPLICATION DATA
        function renderApp() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filter = document.getElementById('dateFilter').value;

            let filteredTxs = state.transactions.filter(t => {
                const matchSearch = t.desc.toLowerCase().includes(search) || t.category.toLowerCase().includes(search);
                const txDate = new Date(t.date);
                const now = new Date();

                let matchDate = true;
                if (filter === 'today') {
                    matchDate = txDate.toDateString() === now.toDateString();
                } else if (filter === 'week') {
                    const oneWeekAgo = new Date();
                    oneWeekAgo.setDate(now.getDate() - 7);
                    matchDate = txDate >= oneWeekAgo;
                } else if (filter === 'month') {
                    matchDate = txDate.getMonth() === now.getMonth() && txDate.getFullYear() === now.getFullYear();
                }

                return matchSearch && matchDate;
            });

            // Update Summary Totals
            let income = 0, expense = 0;
            filteredTxs.forEach(t => {
                if (t.type === 'gelir') income += t.amount;
                else expense += t.amount;
            });

            document.getElementById('summaryIncome').innerText = '₺' + income.toLocaleString('tr-TR', { minimumFractionDigits: 2 });
            document.getElementById('summaryExpense').innerText = '₺' + expense.toLocaleString('tr-TR', { minimumFractionDigits: 2 });
            document.getElementById('summaryNet').innerText = '₺' + (income - expense).toLocaleString('tr-TR', { minimumFractionDigits: 2 });
            document.getElementById('txCountBadge').innerText = filteredTxs.length + ' İşlem';

            // Render Transactions List
            const list = document.getElementById('transactionsList');
            list.innerHTML = '';

            if (filteredTxs.length === 0) {
                list.innerHTML = '<div class="text-center py-8 text-xs text-slate-400">Henüz bir işlem bulunamadı.</div>';
                return;
            }

            filteredTxs.forEach(t => {
                const catObj = state.categories.find(c => c.name === t.category) || { icon: 'tag', color: 'bg-slate-500' };
                const item = document.createElement('div');
                item.className = 'flex items-center justify-between p-3 bg-white border border-slate-200/80 rounded-xl shadow-sm hover:border-slate-300 transition';

                item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 ${catObj.color} text-white rounded-full flex items-center justify-center shrink-0 shadow-sm">
                            <i data-lucide="${catObj.icon}" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <span class="text-xs font-bold text-slate-800 block">${t.desc}</span>
                            <span class="text-[10px] text-slate-400">${t.category} • ${t.date}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="text-xs font-extrabold ${t.type === 'gelir' ? 'text-emerald-600' : 'text-red-500'}">
                            ${t.type === 'gelir' ? '+' : '-'}₺${t.amount.toLocaleString('tr-TR', { minimumFractionDigits: 2 })}
                        </span>
                        <button onclick="deleteTransaction('${t.id}')" class="text-slate-300 hover:text-red-500 transition">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                `;
                list.appendChild(item);
            });

            lucide.createIcons();
        }

        // RENDER ANALYTICS CHART
        function renderAnalyticsChart() {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            const catTotals = {};

            state.transactions.filter(t => t.type === 'gider').forEach(t => {
                catTotals[t.category] = (catTotals[t.category] || 0) + t.amount;
            });

            const labels = Object.keys(catTotals);
            const data = Object.values(catTotals);
            const bgColors = ['#10b981', '#f59e0b', '#3b82f6', '#f97316', '#a855f7', '#f43f5e'];

            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels,
                    datasets: [{
                        data,
                        backgroundColor: bgColors,
                        borderWidth: 0
                    }]
                },
                options: {
                    plugins: { legend: { display: false } },
                    cutout: '75%'
                }
            });

            // Breakdown List
            const breakdown = document.getElementById('categoryBreakdown');
            breakdown.innerHTML = '';
            const totalExp = data.reduce((a, b) => a + b, 0);

            labels.forEach((label, i) => {
                const amt = data[i];
                const pct = totalExp > 0 ? ((amt / totalExp) * 100).toFixed(1) : 0;
                
                const row = document.createElement('div');
                row.className = 'p-3 bg-white border border-slate-200 rounded-xl space-y-1';
                row.innerHTML = `
                    <div class="flex justify-between text-xs font-bold text-slate-700">
                        <span>${label}</span>
                        <span>₺${amt.toLocaleString('tr-TR')} (%${pct})</span>
                    </div>
                    <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                        <div class="h-full bg-red-500" style="width: ${pct}%"></div>
                    </div>
                `;
                breakdown.appendChild(row);
            });
        }

        // RENDER RECURRING LIST
        function renderRecurringList() {
            const list = document.getElementById('recurringList');
            list.innerHTML = '';

            const recurringTxs = state.transactions.filter(t => t.isRecurring);
            if (recurringTxs.length === 0) {
                list.innerHTML = '<div class="text-center py-8 text-xs text-slate-400">Sabit eklenmiş otomatik ödeme yok.</div>';
                return;
            }

            recurringTxs.forEach(t => {
                const item = document.createElement('div');
                item.className = 'flex items-center justify-between p-3 bg-white border border-slate-200 rounded-xl';
                item.innerHTML = `
                    <div>
                        <span class="text-xs font-bold text-slate-800 block">${t.desc}</span>
                        <span class="text-[10px] text-slate-400">Her Ay • ${t.category}</span>
                    </div>
                    <span class="text-xs font-extrabold text-red-500">₺${t.amount.toLocaleString('tr-TR')}</span>
                `;
                list.appendChild(item);
            });
        }

        // CSV & JSON EXPORT / IMPORT
        function exportCSV() {
            let csv = "\uFEFFTarih,Tür,Kategori,Tutar,Açıklama\n";
            state.transactions.forEach(t => {
                csv += `"${t.date}","${t.type}","${t.category}","${t.amount}","${t.desc}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'money_manager_rapor.csv';
            a.click();
        }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
            const a = document.createElement('a');
            a.href = dataStr;
            a.download = 'money_manager_backup.json';
            a.click();
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedState = JSON.parse(e.target.result);
                    if (importedState.transactions) {
                        state = importedState;
                        saveToLocalStorage();
                        renderApp();
                        alert('Yedek başarıyla yüklendi!');
                        closeModal('settingsModal');
                    }
                } catch(err) {
                    alert('Geçersiz JSON dosyası!');
                }
            };
            reader.readAsText(file);
        }

        function openSettingsModal() {
            updateSettingsUI();
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        function saveToLocalStorage() {
            localStorage.setItem('mm_txs', JSON.stringify(state.transactions));
            localStorage.setItem('mm_cats', JSON.stringify(state.categories));
        }

        function resetAllData() {
            if (confirm('Tüm verileri silmek istediğinize emin misiniz? Bu işlem geri alınamaz!')) {
                localStorage.clear();
                state.transactions = [];
                saveToLocalStorage();
                renderApp();
                closeModal('settingsModal');
            }
        }
    </script>
</body>
</html>
